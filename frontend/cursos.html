<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cursos - Sistema de Gestão Acadêmica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Gestão<br>Acadêmica</div>
            <nav>
                <a href="index.html">Início</a>
                <a href="alunos.html">Alunos</a>
                <a href="cursos.html" class="active">Cursos</a>
                <a href="professores.html">Professores</a>
                <a href="turmas.html">Turmas</a>
            </nav>
        </aside>

        <div class="content">
            <main>
                <h1>Gestão de Cursos</h1>

                <section>
                    <h2>Cadastrar Curso</h2>
                    <form id="form-cadastro-curso">
                        <label for="nome">Nome do curso</label>
                        <input type="text" id="nome" name="nome" required>

                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" name="descricao" required>

                        <label for="cargaHoraria">Carga horária</label>
                        <input type="number" id="cargaHoraria" name="cargaHoraria" required>

                        <button type="submit">Cadastrar</button>
                    </form>

                    <div id="mensagem-cadastro"></div>
                </section>

                <section>
                    <h2>Cursos</h2>
                    <div class="acoes-listagem">
                        <button id="btn-listar-ativos">Ver Ativos</button>
                        <button id="btn-listar-desativados">Ver Desativados</button>
                    </div>

                    <table id="tabela-cursos">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Carga Horária</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela-cursos"></tbody>
                    </table>

                    <div id="mensagem-listagem"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/cursos.js"></script>
</body>

</html>
